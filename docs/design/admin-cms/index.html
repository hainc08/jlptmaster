<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JLPT Master Admin — Design Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens (Material Design 3 roles) ---------- */
:root{
  --primary:#3730A3; --on-primary:#fff; --primary-container:#E3E1FF; --on-primary-container:#1A1465;
  --accent:#C0331B; --on-accent:#fff; --accent-container:#FFDAD3; --on-accent-container:#5C1000;
  --surface:#FAF9FD; --surface-1:#fff; --surface-2:#F3F2F8; --surface-3:#EBEAF2;
  --on-surface:#1B1B22; --on-surface-variant:#46464F; --outline:#767680; --outline-variant:#CAC9D4;
  --ok:#14663A; --ok-c:#D3F0DC; --warn:#744C00; --warn-c:#FFE7B0; --err:#9A2B1B; --err-c:#FFDAD3; --neu:#46464F; --neu-c:#E4E2EC;
  --r-card:12px; --r-ctl:8px; --sp:8px; --side:256px; --rail:72px;
  --shadow:0 1px 2px rgba(27,27,34,.08),0 1px 3px rgba(27,27,34,.06);
  --font:'Noto Sans','Noto Sans JP','Hiragino Sans','Yu Gothic UI','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--surface);color:var(--on-surface);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;fill:currentColor;flex:none}
/* type scale */
.t-display{font-size:28px;line-height:36px;font-weight:600}
.t-title{font-size:22px;line-height:28px;font-weight:600}
.t-sub{font-size:16px;line-height:24px;font-weight:600}
.t-label{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--on-surface-variant)}
.muted{color:var(--on-surface-variant)}
.jp{font-family:'Noto Sans JP','Noto Sans',sans-serif}

/* ---------- Shell ---------- */
#app{display:grid;grid-template-columns:var(--side) 1fr;grid-template-rows:64px 1fr;height:100vh;transition:grid-template-columns .2s}
body.rail #app{grid-template-columns:var(--rail) 1fr}
.topbar{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 24px 0 16px;background:var(--surface-1);border-bottom:1px solid var(--outline-variant);z-index:20}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px;white-space:nowrap}
.logo{width:36px;height:36px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;position:relative}
.logo::after{content:"";position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface-1)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--on-surface-variant)}
.icon-btn:hover{background:var(--surface-3)}
.search{flex:1;max-width:520px;margin-left:16px;position:relative}
.search input{width:100%;height:40px;border-radius:20px;border:1px solid var(--outline-variant);background:var(--surface-2);padding:0 16px 0 44px}
.search input:focus{background:#fff;border-color:var(--primary)}
.search svg{position:absolute;left:14px;top:10px;color:var(--on-surface-variant)}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--outline);border-radius:20px;overflow:hidden}
.seg button{border:0;background:transparent;padding:0 12px;height:32px;cursor:pointer;font-weight:600;font-size:12px;color:var(--on-surface-variant)}
.seg button[aria-pressed=true]{background:var(--primary-container);color:var(--on-primary-container)}
.seg button+button{border-left:1px solid var(--outline-variant)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.menu-wrap{position:relative}
.avatar-btn{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:4px 8px 4px 4px;border-radius:24px;cursor:pointer}
.avatar-btn:hover{background:var(--surface-3)}
.avatar-btn .who{text-align:left;line-height:16px}
.avatar-btn .who b{display:block;font-size:13px}
.avatar-btn .who span{font-size:12px;color:var(--on-surface-variant)}
.pop{position:absolute;right:0;top:48px;min-width:220px;background:var(--surface-1);border-radius:var(--r-card);box-shadow:0 4px 16px rgba(27,27,34,.18);border:1px solid var(--outline-variant);padding:8px;z-index:40;display:none}
.pop.open{display:block}
.pop .item{display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:transparent;border-radius:8px;cursor:pointer}
.pop .item:hover{background:var(--surface-2)}
.pop hr{border:0;border-top:1px solid var(--outline-variant);margin:8px 0}

.side{background:var(--surface-1);border-right:1px solid var(--outline-variant);padding:12px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:24px;color:var(--on-surface-variant);text-decoration:none;font-weight:600;white-space:nowrap}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current=page]{background:var(--primary-container);color:var(--on-primary-container)}
.nav a[aria-current=page] svg{color:var(--primary)}
body.rail .nav a{justify-content:center;padding:0}
body.rail .nav a span.lbl, body.rail .side .foot .lbl{display:none}
.side .foot{margin-top:auto;padding:12px;border-radius:12px;background:var(--surface-2);font-size:12px;color:var(--on-surface-variant)}
.main{overflow:auto;padding:24px 32px 96px;position:relative}
.page{max-width:1280px;margin:0 auto}
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.crumbs{font-size:12px;color:var(--on-surface-variant);margin-bottom:4px}
.crumbs a{color:inherit}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Buttons / fields ---------- */
.btn{height:40px;padding:0 20px;border-radius:20px;border:1px solid transparent;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.sm{height:32px;padding:0 14px;font-size:13px}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.filled:hover{background:#2c2688}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.tonal{background:var(--primary-container);color:var(--on-primary-container)}
.btn.outline{border-color:var(--outline);color:var(--primary);background:transparent}
.btn.outline:hover,.btn.text:hover{background:var(--primary-container)}
.btn.text{background:transparent;color:var(--primary);padding:0 12px}
.btn.danger{background:var(--err);color:#fff}
.btn.danger-o{border-color:var(--err);color:var(--err);background:transparent}
.btn.danger-o:hover{background:var(--err-c)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl-s{font-weight:600;font-size:13px}
.field .hint{font-size:12px;color:var(--on-surface-variant)}
.in,.sel,.ta{height:40px;border:1px solid var(--outline);border-radius:var(--r-ctl);padding:0 12px;background:#fff;width:100%}
.ta{height:auto;padding:10px 12px;resize:vertical;min-height:84px}
.in:focus,.sel:focus,.ta:focus{border-color:var(--primary);outline:2px solid var(--primary);outline-offset:-1px}
.in.err{border-color:var(--err)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--surface-1);border-radius:var(--r-card);box-shadow:var(--shadow);border:1px solid var(--outline-variant)}
.card-pad{padding:24px}
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;width:100%;height:100%;z-index:1}
.sw i{position:absolute;inset:0;border-radius:16px;border:2px solid var(--outline);background:var(--surface-3);transition:.15s}
.sw i::after{content:"";position:absolute;left:6px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--outline);transition:.15s}
.sw input:checked+i{background:var(--primary);border-color:var(--primary)}
.sw input:checked+i::after{left:26px;top:4px;width:24px;height:24px;left:22px;background:#fff;top:2px}
.sw input:focus-visible+i{outline:3px solid var(--primary);outline-offset:2px}
.sw input:disabled{cursor:not-allowed}.sw input:disabled+i{opacity:.4}
input[type=checkbox].cb{width:18px;height:18px;accent-color:var(--primary);cursor:pointer}

/* ---------- Chips ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.active,.chip.published{background:var(--ok-c);color:var(--ok)}
.chip.suspended{background:var(--err-c);color:var(--err)}
.chip.pending,.chip.draft{background:var(--warn-c);color:var(--warn)}
.chip.expired,.chip.soon{background:var(--neu-c);color:var(--neu)}
.chip.lvl{background:var(--primary-container);color:var(--on-primary-container);border-radius:6px;padding:0 8px}
.chip.lvl::before{display:none}
.fchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border-radius:8px;border:1px solid var(--outline);background:#fff;font-size:13px;font-weight:500}
.fchip button{border:0;background:transparent;width:22px;height:22px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--on-surface-variant)}
.fchip button:hover{background:var(--surface-3)}
.fchip svg{width:16px;height:16px}

/* ---------- Table ---------- */
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px}
.toolbar .in{width:280px}
.toolbar .sel{width:auto;min-width:140px}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 380px);min-height:240px;border-top:1px solid var(--outline-variant)}
table{border-collapse:separate;border-spacing:0;width:100%}
thead th{position:sticky;top:0;background:var(--surface-2);z-index:2;text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--on-surface-variant);padding:0 16px;height:44px;border-bottom:1px solid var(--outline-variant);white-space:nowrap}
tbody td{padding:0 16px;height:56px;border-bottom:1px solid var(--surface-3);white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel{background:var(--primary-container)}
td.chk,th.chk{width:48px;padding-right:0}
.cell-user{display:flex;align-items:center;gap:12px}
.cell-user b{display:block;font-weight:600}
.cell-user a{color:inherit;text-decoration:none;font-weight:600}
.cell-user a:hover{text-decoration:underline;color:var(--primary)}
.pager{display:flex;align-items:center;gap:12px;padding:8px 16px;border-top:1px solid var(--outline-variant);color:var(--on-surface-variant);font-size:13px;justify-content:flex-end}
.pager .sel{width:auto;height:32px}
.bulk{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--primary);color:#fff;border-radius:0}
.bulk .btn{color:#fff;border-color:rgba(255,255,255,.6)}
.bulk .btn:hover{background:rgba(255,255,255,.14)}
.bulk .count{font-weight:600;margin-right:8px}

/* ---------- States ---------- */
.state{display:grid;place-items:center;text-align:center;padding:64px 16px;gap:12px}
.state .ic{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--on-surface-variant)}
.state .ic svg{width:36px;height:36px}
.state.err .ic{background:var(--err-c);color:var(--err)}
.skel{display:block;border-radius:6px;background:linear-gradient(90deg,var(--surface-3) 25%,var(--surface-2) 50%,var(--surface-3) 75%);background-size:200% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

/* ---------- Dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{padding:20px}
.kpi .row{display:flex;align-items:center;gap:8px;color:var(--on-surface-variant);font-weight:600}
.kpi .row .ic{width:32px;height:32px;border-radius:8px;background:var(--primary-container);color:var(--primary);display:grid;place-items:center}
.kpi .val{font-size:32px;line-height:40px;font-weight:700;margin:12px 0 4px}
.delta{font-size:12px;font-weight:600}
.delta.up{color:var(--ok)}.delta.down{color:var(--err)}
.charts{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px}
.chart-card{padding:20px}
.chart-card svg{width:100%;height:auto;display:block}
.act{list-style:none;margin:0;padding:0}
.act li{display:flex;gap:12px;align-items:center;padding:12px 20px;border-top:1px solid var(--surface-3)}
.act li .dot{width:32px;height:32px;border-radius:50%;background:var(--primary-container);color:var(--primary);display:grid;place-items:center;flex:none}
.act li time{margin-left:auto;color:var(--on-surface-variant);font-size:12px;white-space:nowrap}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--outline-variant);margin-bottom:24px;overflow:auto}
.tabs button{border:0;background:transparent;height:48px;padding:0 20px;font-weight:600;color:var(--on-surface-variant);cursor:pointer;position:relative;white-space:nowrap}
.tabs button:hover{background:var(--surface-2)}
.tabs button[aria-selected=true]{color:var(--primary)}
.tabs button[aria-selected=true]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--primary)}

/* ---------- Member detail ---------- */
.profile{display:flex;gap:24px;align-items:center;padding:24px;flex-wrap:wrap}
.profile .avatar{width:80px;height:80px;font-size:28px}
.profile .meta{display:flex;gap:24px;flex-wrap:wrap;margin-top:8px;color:var(--on-surface-variant)}
.progress{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary)}
.lvl-prog{display:grid;grid-template-columns:56px 1fr 64px;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--surface-3)}
.dl{display:grid;grid-template-columns:200px 1fr;gap:0}
.dl>div{padding:14px 0;border-top:1px solid var(--surface-3)}
.dl>div:nth-child(odd){color:var(--on-surface-variant);font-weight:600}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-top:1px solid var(--surface-3)}

/* ---------- Levels ---------- */
.lvl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.lvl-card{padding:20px;display:flex;flex-direction:column;gap:16px}
.lvl-card .top{display:flex;align-items:center;gap:12px}
.lvl-badge{width:56px;height:56px;border-radius:14px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700}
.lvl-badge.off{background:var(--surface-3);color:var(--on-surface-variant)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--surface-2);border-radius:8px;padding:8px}
.stats b{display:block;font-size:18px}
.stats span{font-size:12px;color:var(--on-surface-variant)}
.scrim{position:fixed;inset:0;background:rgba(27,27,34,.4);z-index:60;display:none}
.scrim.open{display:block}
.panel{position:fixed;right:0;top:0;bottom:0;width:440px;max-width:100%;background:var(--surface-1);z-index:61;box-shadow:-8px 0 24px rgba(27,27,34,.2);transform:translateX(105%);transition:transform .22s;display:flex;flex-direction:column}
.panel.open{transform:none}
.panel header{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--outline-variant)}
.panel .body{padding:24px;overflow:auto;display:flex;flex-direction:column;gap:20px;flex:1}
.panel footer{padding:16px 24px;border-top:1px solid var(--outline-variant);display:flex;gap:8px;justify-content:flex-end}

/* ---------- Settings ---------- */
.matrix th,.matrix td{text-align:center}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.tpl{display:flex;align-items:center;gap:16px;padding:16px 0;border-top:1px solid var(--surface-3)}
.tpl>div:first-child{flex:1}
.savebar{position:fixed;left:var(--side);right:0;bottom:0;z-index:30;background:var(--surface-1);border-top:1px solid var(--outline-variant);padding:12px 32px;display:flex;align-items:center;gap:12px;box-shadow:0 -2px 8px rgba(27,27,34,.08);transition:left .2s}
body.rail .savebar{left:var(--rail)}
.unsaved{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.unsaved i{width:10px;height:10px;border-radius:50%;background:var(--outline)}
.unsaved.dirty{color:var(--accent)}.unsaved.dirty i{background:var(--accent)}
.logo-drop{display:flex;align-items:center;gap:16px}
.logo-drop .logo{width:64px;height:64px;border-radius:16px;font-size:30px}

/* ---------- Audit ---------- */
.diff{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 24px 20px 64px;background:var(--surface-2)}
.diff pre{margin:0;padding:12px;border-radius:8px;font:12px/18px ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow:auto}
.diff .b pre{background:var(--err-c);color:#5c1000}
.diff .a pre{background:var(--ok-c);color:#0a3d20}
.exp{transition:transform .15s}.exp[aria-expanded=true] svg{transform:rotate(180deg)}
.act-chip{font:600 12px/16px ui-monospace,Consolas,monospace;background:var(--surface-3);padding:2px 8px;border-radius:6px}

/* ---------- Dialog / toast ---------- */
.dlg{position:fixed;inset:0;display:none;place-items:center;z-index:80;background:rgba(27,27,34,.5);padding:16px}
.dlg.open{display:grid}
.dlg .box{background:var(--surface-1);border-radius:28px;padding:24px;width:min(440px,100%);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.dlg h2{font-size:22px;line-height:28px;font-weight:600;margin-bottom:12px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#2F2F38;color:#fff;border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,.3);animation:up .2s}
.toast b{color:#FFB4A5;cursor:pointer;font-weight:600}
@keyframes up{from{transform:translateY(12px);opacity:0}}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .hero{background:var(--primary);color:#fff;padding:64px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login .hero .sun{position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;background:var(--accent);opacity:.9}
.login .hero .kanji{position:absolute;right:56px;bottom:72px;font-size:140px;font-weight:700;color:#fff;opacity:.95;font-family:'Noto Sans JP',sans-serif;line-height:1}
.login .form{display:grid;place-items:center;padding:32px}
.login .form .card{width:min(420px,100%);padding:32px;display:flex;flex-direction:column;gap:20px}

/* ---------- Responsive ---------- */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}}
@media (max-width:768px){
  #app{grid-template-columns:var(--rail) 1fr}
  .nav a{justify-content:center;padding:0}.nav a span.lbl,.side .foot .lbl{display:none}
  #collapse{display:none}.savebar{left:var(--rail)!important;padding:12px 16px}
  .main{padding:16px 16px 96px}.avatar-btn .who{display:none}.brand .name{display:none}
  .grid2,.diff{grid-template-columns:1fr}.login{grid-template-columns:1fr}.login .hero{display:none}
  .lang-seg{display:none}.search{margin-left:0}.dl{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="scrim" class="scrim"></div>
<aside id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title"></aside>
<div id="dlg" class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-title"><div class="box"></div></div>
<div id="toasts" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   MOCK DATA ONLY — no API, no database (UI review prototype)
   ========================================================= */

/* ---------- charts ---------- */
function lineChart(){
  const W=640,H=240,p={l:40,r:12,t:12,b:28};
  const d=Array.from({length:30},(_,i)=>Math.round(780+Math.sin(i/3.2)*110+i*9+((i*37)%60)));
  const max=1400,min=600,x=i=>p.l+i*(W-p.l-p.r)/29,y=v=>p.t+(1-(v-min)/(max-min))*(H-p.t-p.b);
  const pts=d.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const grid=[600,800,1000,1200,1400].map(v=>`<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="#E4E2EC"/><text x="${p.l-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#46464F">${v}</text>`).join('');
  const xl=[0,7,14,21,29].map(i=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#46464F">${i===29?'06/11':`${String(7+i).padStart(2,'0')}/10`.replace(/^(3[2-9]|[4-9]\d)/,'')}</text>`).join('');
  const dates=['07/10','14/10','21/10','28/10','06/11'];
  const xl2=[0,7,14,21,29].map((i,k)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#46464F">${dates[k]}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily active members over the last 30 days, rising from about 800 to 1,200"><title>Daily active members, last 30 days</title>${grid}${xl2}
   <polygon points="${x(0)},${y(min)} ${pts} ${x(29)},${y(min)}" fill="#3730A3" opacity=".10"/>
   <polyline points="${pts}" fill="none" stroke="#3730A3" stroke-width="2.5" stroke-linejoin="round"/>
   <circle cx="${x(29)}" cy="${y(d[29])}" r="5" fill="#C0331B" stroke="#fff" stroke-width="2"/></svg>`;
}
function barChart(){
  const data=[['N5',2310],['N4',842],['N3',410],['N2',190],['N1',90]],W=420,H=240,p={l:36,r:8,t:20,b:28},max=2500;
  const bw=44,gap=(W-p.l-p.r-bw*5)/5;
  const bars=data.map(([k,v],i)=>{const h=(v/max)*(H-p.t-p.b),x=p.l+gap/2+i*(bw+gap),y=H-p.b-h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="6" fill="${i===0?'#3730A3':'#8C88D6'}"/><text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="12" font-weight="600" fill="#1B1B22">${v.toLocaleString('en-US')}</text><text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="#46464F">${k}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Members by level: N5 2,310; N4 842; N3 410; N2 190; N1 90"><title>Members by target level</title><line x1="${p.l}" x2="${W-p.r}" y1="${H-p.b}" y2="${H-p.b}" stroke="#CAC9D4"/>${bars}</svg>`;
}

function renderMembers(){
  const chips=[['q',S.q&&`Search: “${S.q}”`],['level',S.level&&`Level: ${S.level}`],['status',S.status&&`Status: ${STL[S.status]}`],['plan',S.plan&&`Plan: ${S.plan}`]].filter(c=>c[1]);
  $('#chips').innerHTML=chips.map(([k,l])=>`<span class="fchip">${l}<button data-act="clr" data-k="${k}" aria-label="Remove filter ${l}">${ic('close')}</button></span>`).join('')+(chips.length>1?`<button class="btn text sm" data-act="clr-all">Clear all</button>`:'');
  const res=$('#mres'),bulk=$('#bulk');
  if(S.view==='loading'){bulk.innerHTML='';res.innerHTML=`<div class="tbl-wrap" aria-busy="true" aria-label="Loading members">${Array.from({length:7},()=>`<div style="display:flex;gap:16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--surface-3)"><span class="skel" style="width:18px;height:18px"></span><span class="skel" style="width:36px;height:36px;border-radius:50%"></span><span class="skel" style="width:180px;height:14px"></span><span class="skel" style="width:220px;height:14px"></span><span class="skel" style="width:60px;height:14px"></span><span class="skel" style="width:80px;height:24px;border-radius:12px"></span></div>`).join('')}</div>`;return}
  if(S.view==='error'){bulk.innerHTML='';res.innerHTML=`<div class="state err" role="alert"><div class="ic">${ic('error')}</div><h2 class="t-sub">Couldn’t load members</h2><p class="muted">The request timed out. Your data is safe — try again.</p><button class="btn tonal" data-act="retry">Try again</button></div>`;return}
  const rows=S.view==='empty'?[]:filtered(),pages=Math.max(1,Math.ceil(rows.length/S.per));S.page=Math.min(S.page,pages);
  const pg=rows.slice((S.page-1)*S.per,S.page*S.per);
  if(!rows.length){bulk.innerHTML='';res.innerHTML=`<div class="state"><div class="ic">${ic('inbox')}</div><h2 class="t-sub">${S.view==='empty'?'No members yet':'No members match these filters'}</h2><p class="muted">${S.view==='empty'?'Add your first learner to get started.':'Try removing a filter or searching a different term.'}</p>${S.view==='empty'?`<button class="btn filled" data-act="add-member">${ic('add')}${t('add')}</button>`:`<button class="btn tonal" data-act="clr-all">Clear filters</button>`}</div>`;return}
  const n=S.sel.size;
  bulk.innerHTML=n?`<div class="bulk" role="region" aria-label="Bulk actions"><span class="count">${n} selected</span><button class="btn sm outline" data-act="bulk-suspend">${ic('block')}Suspend</button><button class="btn sm outline" data-act="bulk-level">${ic('school')}Change level</button><button class="btn sm outline" data-act="bulk-export">${ic('download')}Export CSV</button><span class="spacer"></span><button class="btn sm text" style="color:#fff" data-act="sel-none">Clear</button></div>`:'';
  const allOn=pg.every(m=>S.sel.has(m.id));
  res.innerHTML=`<div class="tbl-wrap"><table><thead><tr><th class="chk"><input class="cb" type="checkbox" id="selall" aria-label="Select all on page" ${allOn?'checked':''}></th><th>Member</th><th>Email</th><th>Level</th><th>Plan</th><th>Status</th><th>Joined</th><th>Last active</th><th></th></tr></thead><tbody>
   ${pg.map(m=>`<tr class="${S.sel.has(m.id)?'sel':''}"><td class="chk"><input class="cb rowcb" type="checkbox" data-id="${m.id}" aria-label="Select ${m.name}" ${S.sel.has(m.id)?'checked':''}></td>
    <td><div class="cell-user">${av(m)}<a href="#/members/${m.id}" ${m.jp?'class="jp"':''}>${m.name}</a></div></td><td class="muted">${m.email}</td><td><span class="chip lvl">${m.level}</span></td><td>${m.plan}</td>
    <td><span class="chip ${m.status}">${STL[m.status]}</span></td><td>${m.joined}</td><td class="muted">${m.last}</td>
    <td><button class="icon-btn" aria-label="Open ${m.name}" onclick="location.hash='#/members/${m.id}'">${ic('right')}</button></td></tr>`).join('')}</tbody></table></div>
   <div class="pager"><span>Rows</span><select class="sel" id="per" aria-label="Rows per page"><option ${S.per===10?'selected':''}>10</option><option ${S.per===25?'selected':''}>25</option></select>
    <span>${(S.page-1)*S.per+1}–${(S.page-1)*S.per+pg.length} of ${rows.length}</span>
    <button class="icon-btn" data-act="pg" data-d="-1" aria-label="Previous page" ${S.page<=1?'disabled':''}>${ic('left')}</button><button class="icon-btn" data-act="pg" data-d="1" aria-label="Next page" ${S.page>=pages?'disabled':''}>${ic('right')}</button></div>`;
}

function auditView(){
  const actors=[...new Set(AUDIT.map(a=>a[0]))],acts=[...new Set(AUDIT.map(a=>a[2].split('.')[0]))];
  return `<div class="page">${head('Home / '+t('audit'),t('audit'),`<button class="btn outline" data-act="toast" data-msg="CSV export queued (mock)">${ic('download')}Export</button>`)}
  <section class="card"><div class="toolbar"><label class="sr" for="aa">Actor</label><select class="sel" id="aa"><option value="">All actors</option>${actors.map(a=>`<option ${af.actor===a?'selected':''}>${a}</option>`).join('')}</select>
   <label class="sr" for="ab">Module</label><select class="sel" id="ab"><option value="">All modules</option>${acts.map(a=>`<option ${af.action===a?'selected':''}>${a}</option>`).join('')}</select>
   <label class="sr" for="ac">Date</label><select class="sel" id="ac"><option>Last 7 days</option><option>Last 30 days</option></select></div><div id="ares"></div></section></div>`;
}
function renderAudit(){
  const rows=AUDIT.filter(a=>(!af.actor||a[0]===af.actor)&&(!af.action||a[2].startsWith(af.action+'.')));
  $('#ares').innerHTML=rows.length?`<div class="tbl-wrap"><table><thead><tr><th style="width:48px"></th><th>Actor</th><th>Action</th><th>Target</th><th>Timestamp</th><th>IP</th></tr></thead><tbody>
  ${rows.map(a=>{const k=AUDIT.indexOf(a),o=af.open.has(k);return `<tr><td><button class="icon-btn exp" data-act="exp" data-k="${k}" aria-expanded="${o}" aria-label="Show changes">${ic('down')}</button></td><td><b>${a[0]}</b><div class="muted" style="font-size:12px">${a[1]}</div></td><td><span class="act-chip">${a[2]}</span></td><td>${a[3]}</td><td>${a[4]}</td><td class="muted">${a[5]}</td></tr>
  ${o?`<tr><td colspan="6" style="padding:0;height:auto"><div class="diff"><div class="b"><div class="t-label" style="margin-bottom:6px">Before</div><pre>${JSON.stringify(a[6],null,2)}</pre></div><div class="a"><div class="t-label" style="margin-bottom:6px">After</div><pre>${JSON.stringify(a[7],null,2)}</pre></div></div></td></tr>`:''}`}).join('')}</tbody></table></div><div class="pager"><span>1–${rows.length} of ${rows.length}</span></div>`
  :`<div class="state"><div class="ic">${ic('inbox')}</div><h2 class="t-sub">No entries match</h2></div>`;
}

/* ---------- overlays ---------- */
function openPanel(html){$('#panel').innerHTML=html;$('#panel').classList.add('open');$('#scrim').classList.add('open');setTimeout(()=>$('#panel input,#panel textarea')?.focus(),50)}
function closePanel(){$('#panel').classList.remove('open');$('#scrim').classList.remove('open')}
let lastFocus=null;
function confirmDlg({title,body,ok='Confirm',danger=false,onOk,extra=''}){
  lastFocus=document.activeElement;
  $('#dlg .box').innerHTML=`<h2 id="dlg-title">${title}</h2><p class="muted">${body}</p>${extra}<div class="acts"><button class="btn text" data-act="dlg-x">Cancel</button><button class="btn ${danger?'danger':'filled'}" id="dlg-ok">${ok}</button></div>`;
  $('#dlg').classList.add('open');$('#dlg-ok').onclick=()=>{const v=$('#dlg select')?.value;closeDlg();onOk&&onOk(v)};$('#dlg-ok').focus();
}
function closeDlg(){$('#dlg').classList.remove('open');lastFocus&&lastFocus.focus?.()}
function toast(msg,undo){const el=document.createElement('div');el.className='toast';el.innerHTML=`<span>${msg}</span>${undo?'<b>Undo</b>':''}`;$('#toasts').append(el);setTimeout(()=>el.remove(),3800);if(undo)el.querySelector('b').onclick=()=>{el.remove()}}
const lvlOpts=cur=>`<div class="field" style="margin-top:16px"><label for="dl">New level</label><select class="sel" id="dl">${['N5','N4','N3','N2','N1'].map(l=>`<option ${l===cur?'selected':''}>${l}</option>`).join('')}</select></div>`;

/* ---------- router ---------- */
function route(){
  closePanel();closeDlg();
  const h=location.hash||'#/login',seg=h.split('/'),r=seg[1]||'login',root=$('#root');
  if(r==='login'){root.innerHTML=loginView();document.title='Sign in — JLPT Master Admin';return}
  root.innerHTML=shell(r);
  const main=$('#main');
  if(r==='dashboard')main.innerHTML=dashView();
  else if(r==='members'&&seg[2]){main.innerHTML=detailView(seg[2]);mtab='Overview';const m=MEMBERS.find(x=>x.id===seg[2]);if(m)$('#tabbody').innerHTML=tabBody(m)}
  else if(r==='members'){main.innerHTML=membersView();renderMembers()}
  else if(r==='levels')main.innerHTML=levelsView();
  else if(r==='settings'){main.innerHTML=settingsView();settingsBody()}
  else if(r==='audit'){main.innerHTML=auditView();renderAudit()}
  else main.innerHTML=dashView();
  document.title=`${r[0].toUpperCase()+r.slice(1)} — JLPT Master Admin`;
}
addEventListener('hashchange',route);

/* ---------- events ---------- */
document.addEventListener('submit',e=>{
  if(e.target.id==='loginf'){e.preventDefault();const em=$('#em');if(!/.+@.+\..+/.test(em.value)){em.classList.add('err');$('#emh').textContent='Enter a valid email address.';$('#emh').style.color='var(--err)';em.focus();return}location.hash='#/dashboard'}
  if(e.target.id==='gsearch'){e.preventDefault();S.q=$('#gs').value;S.page=1;location.hash='#/members';setTimeout(route,0)}
});
document.addEventListener('input',e=>{
  const t_=e.target;
  if(t_.id==='mq'){S.q=t_.value;S.page=1;renderMembers()}
  if(t_.dataset.set){let v=t_.value;if('num' in t_.dataset)v=+v;CUR[t_.dataset.set]=v;if(t_.id==='s-pass')$('#pv').textContent=v+'%';renderSave()}
});
document.addEventListener('change',e=>{
  const t_=e.target,id=t_.id;
  if(id==='fl'){S.level=t_.value;S.page=1;renderMembers()}
  if(id==='fs'){S.status=t_.value;S.page=1;renderMembers()}
  if(id==='fp'){S.plan=t_.value;S.page=1;renderMembers()}
  if(id==='vs'){S.view=t_.value;renderMembers();if(S.view==='loading')setTimeout(()=>{if(S.view==='loading'){S.view='ok';const s=$('#vs');if(s)s.value='ok';renderMembers()}},1600)}
  if(id==='per'){S.per=+t_.value;S.page=1;renderMembers()}
  if(id==='selall'){const rows=filtered().slice((S.page-1)*S.per,S.page*S.per);rows.forEach(m=>t_.checked?S.sel.add(m.id):S.sel.delete(m.id));renderMembers()}
  if(t_.classList.contains('rowcb')){t_.checked?S.sel.add(t_.dataset.id):S.sel.delete(t_.dataset.id);renderMembers()}
  if(id==='aa'){af.actor=t_.value;renderAudit()} if(id==='ab'){af.action=t_.value;renderAudit()}
  if(t_.dataset.perm){const[r,i]=t_.dataset.perm.split('|');CUR.perm[r][+i]=t_.checked?1:0;renderSave()}
  if(t_.dataset.tpl){CUR.tpl[t_.dataset.tpl]=t_.checked?1:0;renderSave()}
});
document.addEventListener('click',e=>{
  const pop=$('#avmenu');
  if(e.target.closest('#avbtn')){const o=pop.classList.toggle('open');$('#avbtn').setAttribute('aria-expanded',o);return}
  if(pop&&!e.target.closest('#avmenu'))pop.classList?.remove('open');
  if(e.target.id==='scrim'){closePanel();return}
  if(e.target.id==='dlg'){closeDlg();return}
  if(e.target.closest('#collapse')){document.body.classList.toggle('rail');return}
  const lg=e.target.closest('[data-lang]');if(lg){LANG=lg.dataset.lang;document.documentElement.lang=LANG;route();return}
  const lv=e.target.closest('[data-lv]');if(lv){S.lvView=lv.dataset.lv;$('#main').innerHTML=levelsView();return}
  const tb=e.target.closest('[data-tab]');if(tb){mtab=tb.dataset.tab;$$('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b===tb));$('#tabbody').innerHTML=tabBody(MEMBERS.find(x=>x.id===location.hash.split('/')[2]));return}
  const st=e.target.closest('[data-stab]');if(st){stab=st.dataset.stab;$$('[data-stab]').forEach(b=>b.setAttribute('aria-selected',b===st));settingsBody();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,m=MEMBERS.find(x=>x.id===b.dataset.id);
  switch(a){
   case'toast':e.preventDefault();toast(b.dataset.msg);break;
   case'clr':S[b.dataset.k]='';S.page=1;route();break;
   case'clr-all':S.q=S.level=S.status=S.plan='';S.view='ok';S.page=1;route();break;
   case'retry':S.view='loading';renderMembers();setTimeout(()=>{S.view='ok';const s=$('#vs');if(s)s.value='ok';renderMembers()},900);break;
   case'pg':S.page+=+b.dataset.d;renderMembers();break;
   case'sel-none':S.sel.clear();renderMembers();break;
   case'bulk-suspend':confirmDlg({title:`Suspend ${S.sel.size} members?`,body:'They will be signed out and unable to take exams until reactivated.',ok:'Suspend',danger:true,onOk:()=>{toast(`${S.sel.size} members suspended`,true);S.sel.clear();renderMembers()}});break;
   case'bulk-level':confirmDlg({title:`Change level for ${S.sel.size} members`,body:'Choose the new target level.',extra:lvlOpts('N5'),ok:'Apply',onOk:v=>{toast(`Level set to ${v} for ${S.sel.size} members`);S.sel.clear();renderMembers()}});break;
   case'bulk-export':toast(`Exporting ${S.sel.size} members to CSV…`);break;
   case'add-member':openPanel(`<header><h2 class="t-title" id="panel-title" style="flex:1">Add member</h2><button class="icon-btn" data-act="panel-close" aria-label="Close">${ic('close')}</button></header><div class="body"><div class="field"><label for="an">Full name *</label><input class="in" id="an" placeholder="e.g. Nguyễn Văn An"></div><div class="field"><label for="ae">Email *</label><input class="in" id="ae" type="email" placeholder="name@example.com"><span class="hint" id="aeh"></span></div><div class="grid2"><div class="field"><label for="al">Level</label><select class="sel" id="al">${['N5','N4','N3','N2','N1'].map(l=>`<option>${l}</option>`).join('')}</select></div><div class="field"><label for="ap">Plan</label><select class="sel" id="ap">${PL.map(l=>`<option>${l}</option>`).join('')}</select></div></div></div><footer><button class="btn text" data-act="panel-close">Cancel</button><button class="btn filled" data-act="add-save">Add member</button></footer>`);break;
   case'add-save':{const em=$('#ae');if(!/.+@.+\..+/.test(em.value)||!$('#an').value.trim()){em.classList.add('err');$('#aeh').textContent='Name and a valid email are required.';$('#aeh').style.color='var(--err)';break}closePanel();toast('Member added (mock)');break}
   case'panel-close':closePanel();break;
   case'dlg-x':closeDlg();break;
   case'edit-member':openPanel(`<header><h2 class="t-title" id="panel-title" style="flex:1">Edit member</h2><button class="icon-btn" data-act="panel-close" aria-label="Close">${ic('close')}</button></header><div class="body"><div class="field"><label for="en">Full name</label><input class="in" id="en" value="${m.name}"></div><div class="field"><label for="ee">Email</label><input class="in" id="ee" value="${m.email}"></div><div class="field"><label for="ep">Phone</label><input class="in" id="ep" value="${m.phone}"></div></div><footer><button class="btn text" data-act="panel-close">Cancel</button><button class="btn filled" data-act="panel-close" onclick="toast('Profile saved (mock)')">Save</button></footer>`);break;
   case'reset-pw':confirmDlg({title:'Reset password?',body:`A reset link will be emailed to ${m.email}. The current password stays valid until they use it.`,ok:'Send reset link',onOk:()=>toast('Reset link sent')});break;
   case'chg-level':confirmDlg({title:'Change level',body:`Select the new target level for ${m.name}.`,extra:lvlOpts(m.level),ok:'Change level',onOk:v=>{m.level=v;toast(`Level changed to ${v}`);route()}});break;
   case'suspend':{const re=m.status==='suspended';confirmDlg({title:re?'Reactivate account?':'Suspend account?',body:re?`${m.name} will be able to sign in again.`:`${m.name} will be signed out and blocked from exams until reactivated.`,ok:re?'Reactivate':'Suspend',danger:!re,onOk:()=>{m.status=re?'active':'suspended';toast(re?'Account reactivated':'Account suspended',true);route()}});break}
   case'del-member':confirmDlg({title:'Delete this member?',body:`This permanently removes ${m.name} and all exam history. This can’t be undone.`,ok:'Delete member',danger:true,onOk:()=>{toast('Member deleted (mock)');location.hash='#/members'}});break;
   case'mv':{const i=+b.dataset.i,d=+b.dataset.d,L=S.levels;[L[i],L[i+d]]=[L[i+d],L[i]];$('#main').innerHTML=levelsView();toast('Display order updated');break}
   case'edit-level':openLevelPanel(b.dataset.code);break;
   case'pmv':{const L=S.levels,i=L.findIndex(x=>x.code===b.dataset.code),d=+b.dataset.d;if(i+d<0||i+d>=L.length)break;[L[i],L[i+d]]=[L[i+d],L[i]];$('#pord').textContent=i+d+1;break}
   case'save-level':{const l=S.levels.find(x=>x.code===b.dataset.code);l.name=$('#ln').value;l.desc=$('#ld').value;l.pass=+$('#lp').value;l.on=$('#le').checked;closePanel();$('#main').innerHTML=levelsView();toast(`${l.code} saved`);break}
   case'save-set':SAVED=structuredClone(CUR);renderSave();toast('Settings saved');break;
   case'discard':CUR=structuredClone(SAVED);settingsBody();toast('Changes discarded');break;
   case'exp':{const k=+b.dataset.k;af.open.has(k)?af.open.delete(k):af.open.add(k);renderAudit();break}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanel();closeDlg();$('#avmenu')?.classList.remove('open')}});
if(innerWidth<=768)document.body.classList.add('rail');
route();
</script>
</body>
</html>
