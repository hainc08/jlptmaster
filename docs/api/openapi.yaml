openapi: 3.0.3
info:
  title: JLPT Master REST API
  description: Version 1 REST API specification for JLPT Master Japanese Learning Platform.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Local Development Server
  - url: https://jlptmaster.vn/api/v1
    description: Production Server

paths:
  /levels:
    get:
      summary: Lấy danh sách 5 cấp độ JLPT
      description: Trả về trạng thái hoạt động của N5 (active) và N4-N1 (coming soon).
      responses:
        '200':
          description: Danh sách cấp độ thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/JlptLevel'

  /courses:
    get:
      summary: Lấy danh sách khóa học theo cấp độ
      parameters:
        - name: level
          in: query
          required: false
          schema:
            type: string
            default: N5
      responses:
        '200':
          description: Danh sách khóa học
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Course'

  /lessons/{id}:
    get:
      summary: Lấy chi tiết bài học
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chi tiết bài học
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LessonDetail'

  /lessons/{id}/complete:
    post:
      summary: Đánh dấu hoàn thành bài học (Idempotent)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Hoàn thành bài học thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lessonId:
                        type: string
                      status:
                        type: string
                        example: COMPLETED
                      completedAt:
                        type: string
                        format: date-time

  /vocabulary:
    get:
      summary: Tra cứu danh sách từ vựng N5
      parameters:
        - name: level
          in: query
          schema:
            type: string
            default: N5
        - name: q
          in: query
          description: Từ khóa tìm kiếm (Hiragana, Romaji, tiếng Việt)
          schema:
            type: string
        - name: pos
          in: query
          description: Lọc theo từ loại
          schema:
            type: string
      responses:
        '200':
          description: Danh sách từ vựng
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VocabularyItem'

  /kanji:
    get:
      summary: Tra cứu chữ Hán N5
      parameters:
        - name: level
          in: query
          schema:
            type: string
            default: N5
      responses:
        '200':
          description: Danh sách chữ Hán
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/KanjiItem'

  /grammar:
    get:
      summary: Tra cứu sổ tay ngữ pháp N5
      parameters:
        - name: level
          in: query
          schema:
            type: string
            default: N5
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Danh sách mẫu ngữ pháp
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GrammarItem'

  /reviews/due:
    get:
      summary: Lấy hàng đợi thẻ nhớ SRS đến hạn ôn tập của người dùng
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Hàng đợi thẻ nhớ
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SrsCardItem'

  /reviews:
    post:
      summary: Gửi đánh giá thẻ nhớ SRS (Idempotent)
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cardId
                - grade
                - idempotencyKey
              properties:
                cardId:
                  type: string
                grade:
                  type: string
                  enum: [AGAIN, HARD, GOOD, EASY]
                idempotencyKey:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Ghi nhận đánh giá thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cardId:
                        type: string
                      nextDueAt:
                        type: string
                        format: date-time
                      intervalSeconds:
                        type: integer

  /practice/questions:
    get:
      summary: Lấy danh sách câu hỏi luyện tập (Không chứa đáp án)
      parameters:
        - name: level
          in: query
          schema:
            type: string
            default: N5
        - name: type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Danh sách câu hỏi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PracticeQuestion'

  /practice/submit:
    post:
      summary: Chấm điểm câu hỏi luyện tập và trả về giải thích tiếng Việt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - questionId
                - selectedOptionId
              properties:
                questionId:
                  type: string
                selectedOptionId:
                  type: string
      responses:
        '200':
          description: Kết quả chấm điểm
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      isCorrect:
                        type: boolean
                      correctOptionId:
                        type: string
                      explanationVi:
                        type: string

  /exams:
    get:
      summary: Lấy danh mục đề thi thử N5
      parameters:
        - name: level
          in: query
          schema:
            type: string
            default: N5
      responses:
        '200':
          description: Danh mục đề thi thử
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExamSummary'

  /exams/{id}/start:
    post:
      summary: Khởi tạo lượt thi mới kèm chụp snapshot đề thi
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Lượt thi đã khởi tạo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ExamAttemptDetail'

  /attempts/{id}:
    get:
      summary: Lấy trạng thái lượt thi đang làm để phục hồi (Resumption)
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trạng thái bài thi đang làm
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ExamAttemptDetail'

  /attempts/{id}/answers:
    put:
      summary: Tự động lưu đáp án bài thi (Autosave debounced)
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - answers
              properties:
                answers:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '200':
          description: Đã lưu tự động thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      savedAt:
                        type: string
                        format: date-time
                      savedCount:
                        type: integer

  /attempts/{id}/finish:
    post:
      summary: Khóa bài thi và thực thi chấm điểm giao dịch (Finalization)
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Nộp bài và chấm điểm thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      attemptId:
                        type: string
                      status:
                        type: string
                        example: SUBMITTED
                      internalScore:
                        type: integer
                        example: 142

  /attempts/{id}/result:
    get:
      summary: Xem báo cáo kết quả và giải thích chi tiết sau khi thi
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Báo cáo kết quả bài thi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ExamResultReport'

  /admin/content/import/preview:
    post:
      summary: Chạy thử kiểm định cú pháp tệp CSV (Dry-Run Preview)
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Kết quả kiểm tra tệp CSV
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      totalRows:
                        type: integer
                      validCount:
                        type: integer
                      errorCount:
                        type: integer
                      previewRows:
                        type: array
                        items:
                          type: object

  /admin/content/import/commit:
    post:
      summary: Cam kết nhập dữ liệu CSV vào MariaDB trong giao dịch ACID
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - importSessionId
              properties:
                importSessionId:
                  type: string
      responses:
        '200':
          description: Nhập dữ liệu thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      insertedCount:
                        type: integer

  # ---- Admin CMS (PROPOSED — see docs/api/admin-cms.md; not approved) ----
  /admin/dashboard:
    get:
      summary: "[module dashboard] KPI, hoạt động 30 ngày, thành viên theo cấp độ, hoạt động gần đây"
      security: [{ sessionAuth: [] }]
      responses:
        '200': { description: OK }
        '401': { description: Chưa đăng nhập }
        '403': { description: Vai trò không có quyền module }

  /admin/members:
    get:
      summary: "[module members] Danh sách thành viên có lọc và phân trang"
      security: [{ sessionAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: level, in: query, schema: { type: string, enum: [N5, N4, N3, N2, N1] } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, SUSPENDED, PENDING, EXPIRED] } }
        - { name: plan, in: query, schema: { type: string, enum: [FREE, STANDARD, PREMIUM] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        '200': { description: "{ data: MemberRow[], page, perPage, total }" }
        '403': { description: Không có quyền }
    post:
      summary: "[module members] Tạo thành viên (không có mật khẩu dùng được; gửi lời mời đặt mật khẩu)"
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, email, level, plan]
              properties:
                displayName: { type: string }
                email: { type: string, format: email }
                level: { type: string, enum: [N5, N4, N3, N2, N1] }
                plan: { type: string, enum: [FREE, STANDARD, PREMIUM] }
      responses:
        '201': { description: Đã tạo }
        '409': { description: Email đã tồn tại }

  /admin/members/export:
    get:
      summary: "[module members] Xuất CSV (UTF-8 BOM, chống formula injection)"
      security: [{ sessionAuth: [] }]
      responses:
        '200': { description: text/csv }

  /admin/members/bulk:
    post:
      summary: "[module members] Hành động hàng loạt; bỏ qua chính mình / tài khoản được bảo vệ"
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids: { type: array, items: { type: string } }
                action: { type: string, enum: [suspend, change-level] }
                level: { type: string }
      responses:
        '200': { description: "{ updated: number, skipped: string[] }" }

  /admin/members/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: "[module members] Chi tiết thành viên"
      security: [{ sessionAuth: [] }]
      responses:
        '200': { description: OK }
        '404': { description: Không tìm thấy }
    patch:
      summary: "[module members] Sửa tên / email"
      security: [{ sessionAuth: [] }]
      responses:
        '200': { description: OK }
        '409': { description: Email trùng }
    delete:
      summary: "[module members] Ẩn danh hóa tài khoản (giữ lịch sử thi)"
      security: [{ sessionAuth: [] }]
      responses:
        '204': { description: Đã ẩn danh }
        '409': { description: Không thể tự xóa mình / OWNER cuối cùng }

  /admin/members/{id}/suspend:
    post:
      summary: "[module members] Tạm khóa và thu hồi phiên"
      security: [{ sessionAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: OK }
        '409': { description: CANNOT_MODIFY_SELF / LAST_OWNER }

  /admin/members/{id}/reactivate:
    post:
      summary: "[module members] Mở khóa"
      security: [{ sessionAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: OK }

  /admin/members/{id}/reset-password:
    post:
      summary: "[module members] Gửi liên kết đặt lại mật khẩu (không trả về mật khẩu)"
      security: [{ sessionAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: OK }

  /admin/members/{id}/change-level:
    post:
      summary: "[module members] Đổi cấp độ mục tiêu"
      security: [{ sessionAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level: { type: string, enum: [N5, N4, N3, N2, N1] }
      responses:
        '204': { description: OK }
        '400': { description: Cấp độ không tồn tại }

  /admin/levels:
    get:
      summary: "[module levels] 5 cấp độ kèm số bài học, đề thi, học viên"
      security: [{ sessionAuth: [] }]
      responses:
        '200': { description: "{ data: LevelRow[] }" }

  /admin/levels/reorder:
    post:
      summary: "[module levels] Sắp xếp lại thứ tự hiển thị (hoán vị đủ 5 mã)"
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order: { type: array, minItems: 5, maxItems: 5, items: { type: string } }
      responses:
        '204': { description: OK }
        '400': { description: Không phải hoán vị hợp lệ }

  /admin/levels/{code}:
    patch:
      summary: "[module levels] Sửa tên, mô tả, điểm đạt (30–100), bật/tắt (chỉ khi PUBLISHED)"
      security: [{ sessionAuth: [] }]
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '400': { description: Giá trị không hợp lệ }
        '409': { description: LEVEL_NOT_PUBLISHED }

  /admin/settings:
    get:
      summary: "[module settings] Cài đặt chung, quy tắc thi, thông báo"
      security: [{ sessionAuth: [] }]
      responses:
        '200': { description: OK }
    patch:
      summary: "[module settings] Cập nhật (timeLimitMin 10–240, retakeLimit 0–10, passThreshold 30–100). Chỉ lưu; engine chưa đọc."
      security: [{ sessionAuth: [] }]
      responses:
        '200': { description: OK }
        '400': { description: Giá trị không hợp lệ }

  /admin/settings/roles:
    get:
      summary: "[module settings] Ma trận vai trò × module"
      security: [{ sessionAuth: [] }]
      responses:
        '200': { description: OK }
    put:
      summary: "[module settings] Thay ma trận; OWNER bất biến, ADMIN giữ dashboard + settings"
      security: [{ sessionAuth: [] }]
      responses:
        '200': { description: OK }
        '409': { description: LOCKOUT }

  /admin/audit:
    get:
      summary: "[module audit] Nhật ký thao tác kèm trước/sau (đã che dữ liệu nhạy cảm)"
      security: [{ sessionAuth: [] }]
      parameters:
        - { name: actor, in: query, schema: { type: string } }
        - { name: module, in: query, schema: { type: string } }
        - { name: range, in: query, schema: { type: string, enum: [7d, 30d] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        '200': { description: "{ data: AuditRow[], total }" }

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: jlpt_session

  schemas:
    JlptLevel:
      type: object
      properties:
        id:
          type: string
          example: N5
        nameVi:
          type: string
          example: Nhập môn căn bản
        isActive:
          type: boolean
          example: true

    Course:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        titleVi:
          type: string
        descriptionVi:
          type: string
        status:
          type: string

    LessonDetail:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        titleVi:
          type: string
        descriptionVi:
          type: string
        estimatedMinutes:
          type: integer
        theorySections:
          type: array
          items:
            type: object

    VocabularyItem:
      type: object
      properties:
        id:
          type: string
        surface:
          type: string
          example: 先生
        reading:
          type: string
          example: せんせい
        meaningVi:
          type: string
          example: Thầy cô giáo
        pos:
          type: string
          example: Danh từ
        exampleJa:
          type: string
        exampleVi:
          type: string

    KanjiItem:
      type: object
      properties:
        id:
          type: string
        character:
          type: string
          example: 先
        hanViet:
          type: string
          example: TIÊN
        meaningVi:
          type: string
        strokes:
          type: integer

    GrammarItem:
      type: object
      properties:
        id:
          type: string
        pattern:
          type: string
          example: N1 は N2 です
        meaningVi:
          type: string
        formationVi:
          type: string
        nuanceVi:
          type: string

    SrsCardItem:
      type: object
      properties:
        id:
          type: string
        frontText:
          type: string
        frontReading:
          type: string
        backMeaningVi:
          type: string
        hanViet:
          type: string
        intervalSeconds:
          type: integer

    PracticeQuestion:
      type: object
      properties:
        id:
          type: string
        questionNumber:
          type: integer
        prompt:
          type: string
        skillTag:
          type: string
        options:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              text:
                type: string

    ExamSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        totalMinutes:
          type: integer
        totalQuestions:
          type: integer

    ExamAttemptDetail:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        remainingSeconds:
          type: integer
        currentSection:
          type: string
        answers:
          type: object

    ExamResultReport:
      type: object
      properties:
        attemptId:
          type: string
        internalScore:
          type: integer
          example: 142
        maxScore:
          type: integer
          example: 180
        statusText:
          type: string
          example: ĐẠT ƯỚC TÍNH (PASS)
        disclaimerVi:
          type: string
        sectionScores:
          type: array
          items:
            type: object
        weakSkills:
          type: array
          items:
            type: object
        itemReviews:
          type: array
          items:
            type: object
